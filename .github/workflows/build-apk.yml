name: Build Everyday Strong APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q EverydayStrong-1.9.2-Android-Project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk EverydayStrong-1.9.2.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: EverydayStrong-1.9.2
          path: EverydayStrong-1.9.2.apk
